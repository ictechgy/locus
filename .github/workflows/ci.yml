name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # No Xcode pin: runner images rotate bundled Xcode versions, and the
      # package builds on any Swift 5.9+ toolchain (swift-syntax 600.x in
      # Swift 5 language mode).
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (release)
        run: swift build -c release
